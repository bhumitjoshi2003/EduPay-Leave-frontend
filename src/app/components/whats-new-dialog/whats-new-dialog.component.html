<div class="wn-root">
  <div class="wn-icon-wrap">
    <span class="wn-sparkle">✨</span>
  </div>

  <h2 class="wn-title">{{ release.title }}</h2>
  <p class="wn-summary" *ngIf="release.summary">{{ release.summary }}</p>

  <ul class="wn-items" *ngIf="release.items?.length">
    <li *ngFor="let item of release.items">{{ item }}</li>
  </ul>

  <div class="wn-actions">
    <button mat-flat-button class="wn-btn-close" (click)="close()">Got it</button>
  </div>
</div>
